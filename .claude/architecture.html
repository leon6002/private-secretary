<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>Personal Secretary — Architecture</title>
<style>
  :root {
    --bg: #f4f5f7;
    --on-surface: #1a1d21;
    --on-surface-variant: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--on-surface);
    padding: 28px 20px 40px;
  }
  .head { max-width: 1240px; margin: 0 auto 18px; }
  h1 { font-size: 22px; font-weight: 600; }
  .sub { color: var(--on-surface-variant); font-size: 13px; margin-top: 3px; }
  .tree-wrap {
    max-width: 1240px;
    margin: 0 auto 22px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px 22px 20px;
  }
  .tree-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--on-surface-variant);
    margin-bottom: 12px;
  }
  .tree-toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .tree-toolbar button {
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: #f8fafc;
    color: #475569;
    cursor: pointer;
  }
  .tree-toolbar button:hover { background: #f1f5f9; }
  #tree-root {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: #1a1d21;
    overflow-x: auto;
  }
  #tree-root ul { list-style: none; margin: 0; padding-left: 18px; }
  #tree-root > ul { padding-left: 0; }
  #tree-root li { white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 4px; border-radius: 4px; padding: 0 4px 0 0; }
  .row:hover { background: #f8fafc; }
  .tw {
    flex: 0 0 auto;
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: none; cursor: pointer;
    color: #64748b; font-size: 10px; padding: 0;
    user-select: none;
  }
  .tw.leaf { visibility: hidden; }
  .nm { font-weight: 700; color: #0f172a; }
  .nm.f { font-weight: 400; color: #334155; }
  .cmt { color: #94a3b8; font-size: 11px; margin-left: 10px; }
  .cat-core { color: #4338ca; }
  .cat-io { color: #7c3aed; }
  .cat-ui { color: #be185d; }
  .cat-state { color: #b45309; }
  .cat-ext { color: #64748b; }
  svg { display: block; width: 100%; height: auto; max-width: 1240px; margin: 0 auto; }
  text { font-family: inherit; }
</style>
</head>

  <div class="sub">One repo, one Node runtime. relay/core is the pure tested decision engine; everything else either feeds it data or renders its output.</div>
