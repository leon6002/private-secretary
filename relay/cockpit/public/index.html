<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>secretary</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#2563EB",
            background: "#F7F7F8",
            surface: "#ffffff",
            "surface-variant": "#F1F2F4",
            outline: "#E5E7EB",
            "on-surface": "#1A1D21",
            "on-surface-variant": "#64748b",
            error: "#ef4444",
          },
          borderRadius: { DEFAULT: "6px", lg: "6px", xl: "11px", sm: "4px" },
          spacing: { xs: "0.25rem", sm: "0.5rem", md: "1rem", gutter: "1rem", lg: "1.5rem", margin: "1.5rem", xl: "2rem" },
          fontFamily: { sans: ["'IBM Plex Sans'", "sans-serif"], chinese: ["'IBM Plex Sans SC'", "sans-serif"] },
          fontSize: {
            display: ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
            headline: ["18px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "500" }],
            "label-xs": ["11px", { lineHeight: "14px", letterSpacing: "0.05em", fontWeight: "600" }],
            "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
            "body-medium": ["14px", { lineHeight: "20px", fontWeight: "500" }],
            "body-base": ["14px", { lineHeight: "20px", fontWeight: "400" }],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/app.css" />
  <meta name="csrf-token" content="__CSRF_TOKEN__" />
</head>
<body class="bg-background text-on-surface h-screen flex overflow-hidden font-sans">
  <!-- 56px global nav rail -->
  <nav class="rail w-[56px] h-full bg-surface border-r border-outline flex flex-col items-center py-md flex-shrink-0 z-10" aria-label="Primary">
    <div class="w-10 h-10 bg-surface-variant rounded flex items-center justify-center mb-xl">
      <span class="font-bold text-[20px]">s.</span>
    </div>
    <div class="flex flex-col gap-lg flex-1 w-full items-center">
      <button class="rail-btn relative w-10 h-10 flex items-center justify-center" data-screen="queue" aria-label="Today" title="Today">
        <span class="material-symbols-outlined text-[20px]">calendar_today</span>
        <span class="rail-badge" id="pending-badge" hidden></span>
      </button>
      <button class="rail-btn w-10 h-10 flex items-center justify-center" data-screen="projects" aria-label="Projects" title="Projects">
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
      </button>
      <button class="rail-btn w-10 h-10 flex items-center justify-center" data-screen="people" aria-label="People" title="People">
        <span class="material-symbols-outlined text-[20px]">group</span>
      </button>
      <button class="rail-btn w-10 h-10 flex items-center justify-center" data-screen="connections" aria-label="Connections" title="Connections">
        <span class="material-symbols-outlined text-[20px]">hub</span>
      </button>
    </div>
    <div class="mt-auto w-8 h-8 rounded-full bg-surface-variant"></div>
  </nav>

  <!-- screen host (everything right of the rail) -->
  <main id="screen" class="screen flex-1 flex flex-col min-w-0" aria-live="polite"></main>

  <!-- keyboard help sheet -->
  <div id="help-sheet" class="help-sheet" hidden>
    <div class="help-card">
      <h2>Keyboard</h2>
      <dl>
        <dt>j / k</dt><dd>next / previous card</dd>
        <dt>a</dt><dd>approve &amp; send</dd>
        <dt>e</dt><dd>edit draft</dd>
        <dt>s</dt><dd>skip</dd>
        <dt>g then q / t / p / c</dt><dd>Queue / Projects / People / Connections</dd>
        <dt>?</dt><dd>this sheet</dd>
      </dl>
      <button class="btn-ghost" id="help-close">close</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
