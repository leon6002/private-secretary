<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>secretary</title>
  <!-- IBM Plex (Sans + SC) via Google Fonts — same approach as the legacy
       public/index.html; deliberately not self-hosted in S1. -->
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <!-- The server (relay/cockpit/server.ts) replaces the placeholder token in
       the meta below with the real CSRF token when serving the built page;
       src/lib/api.ts reads it back for every POST. Do not remove or rename
       this meta, and never write the literal placeholder anywhere else in
       this file — the server replaces only the FIRST occurrence. -->
  <meta name="csrf-token" content="__CSRF_TOKEN__" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
